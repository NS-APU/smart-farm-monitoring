# 顧客評価環境のデプロイ（Issue #71。docs/00_project/commands.md「評価環境（IaC）」）。
# - 手動実行（workflow_dispatch）のみ。自動のトリガ（案: develop へのマージ）は、Issue #78 で方針が決まった後に追加する
# - AWS へは、OIDC の一時的な認証で入る（長期のアクセスキーを使わない）。ロールの ARN は、GitHub の Environment「evaluation」の
#   シークレット AWS_DEPLOY_ROLE_ARN に設定する（ロールは infra/lib/github-oidc-stack.ts で作る。手順は commands.md）
# - Environment「evaluation」で、デプロイできるブランチ・承認者を制限できる（ロールの信頼ポリシーも、この Environment を条件にしている）
# - 独自のサブドメインを使うときは、Environment の変数 SFM_DOMAIN_NAME・SFM_HOSTED_ZONE_NAME を設定する（2 つとも。未設定なら cloudfront.net）
name: Deploy evaluation

on:
  workflow_dispatch:

permissions:
  contents: read
  # OIDC の ID トークンの発行（AWS のロールを引き受けるため）
  id-token: write

# 同時に 2 つのデプロイを動かさない。実行中のデプロイは、止めない（CloudFormation の更新が途中で止まるため）。
concurrency:
  group: deploy-evaluation
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: 画面のビルド（dist/frontend）
        run: pnpm build
      - name: AWS の認証（OIDC）
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: デプロイ（CDK）
        env:
          SFM_DOMAIN_NAME: ${{ vars.SFM_DOMAIN_NAME }}
          SFM_HOSTED_ZONE_NAME: ${{ vars.SFM_HOSTED_ZONE_NAME }}
        run: pnpm --filter @smart-farm/infra run deploy
