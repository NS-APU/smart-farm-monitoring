# CI（docs/40_operations/git-workflow.md「PRの作り方」）。
# - develop 宛て・main 宛ての PR: lint・型検査・単体テスト（結合を含む）・ビルド
# - main 宛ての PR（release/*・hotfix/*）: 上記に加えて、E2E（約 45 分）・負荷テスト（約 2 分）
# - ラベル ci:full を付けた PR: develop 宛てでも、E2E・負荷テストを実行する（確認したいときに使う）
# マージの必須条件にするチェックは、リポジトリの設定（ブランチ保護）で指定する（ジョブ名: lint・typecheck・unit-test・build、main 宛てはさらに e2e・stress）。
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# 秘密情報は使わない。リポジトリの読み取りのみ許可する。
permissions:
  contents: read

# 同じ PR で新しい実行が始まったら、古い実行を止める（E2E は長いため）。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: ESLint・oxlint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-test:
    name: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # DynamoDB アダプタの契約テストが使う、DynamoDB Local（AWS の公式のイメージ 3.3.1）。
    # タグではなく、ダイジェスト（内容のハッシュ）で固定する（タグは、あとから別のイメージに付け替えられるため）。
    # 更新するときは、`public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local` の、新しいタグのダイジェストに差し替える。
    services:
      dynamodb:
        image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab # 3.3.1
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # 単体・結合のテスト。カバレッジの閾値（行・分岐・関数・文が 95% 以上）を下回ると失敗する。
      # DYNAMODB_ENDPOINT: 上の DynamoDB Local。契約テストを、DynamoDB のアダプタにも適用する（接続できるまで待つ）。
      - run: pnpm test:unit
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # main 宛ての PR、またはラベル ci:full の PR で実行する。速いチェックが成功してから始める（長いため）。
  e2e:
    name: e2e
    if: github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    needs: [lint, typecheck, unit-test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # 画面のレイアウトの検査（幅・高さ）は、フォントに依存する。CSS（app.css）の 'Noto Sans CJK JP' を、
      # Linux のランナーでも使えるようにして、Windows・Mac に近い幅にする。
      - name: 日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # ポート 5173・8787 を使う（dev-ports.ts）。ジョブは別のランナーで動くため、負荷テストと衝突しない。
      - run: pnpm test:e2e
      # 失敗の調査用。失敗したテストのスクリーンショット・トレース・エラーの文脈だけを保存する
      # （動画は、全テストで撮影するため、大きく（約 900MB）、保存しない）。
      - name: 失敗時の成果物を保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            test-result/e2e/**/test-failed-*.png
            test-result/e2e/**/error-context.md
            test-result/e2e/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  stress:
    name: stress
    if: github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    needs: [lint, typecheck, unit-test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # E2E と同じフォントにする（モバイル幅の表示の確認があるため）。
      - name: 日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # 許容時間（tests/stress/support/limits.ts）を超える操作があると失敗する。
      # GitHub のランナーは、CPU の速さが実行のたびに違い、同時 10 人の保存（UC-06）が、許容 3 秒を超えたり
      # 超えなかったりした（約 2〜3.5 秒）。そのため、CI だけ、許容時間を 1.5 倍にする（NFR の値は、変えない。手元は 1 倍）。
      # 倍率は、結果ログに記録される。
      - run: pnpm test:stress
        env:
          STRESS_LIMIT_FACTOR: '1.5'
      # 結果ログは、成功・失敗にかかわらず保存する（応答時間の記録）。
      - name: 結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-result
          path: |
            test-result/stresstest.result.log
            test-result/stress/report
          retention-days: 14
          if-no-files-found: ignore
