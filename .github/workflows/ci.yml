# CI（docs/40_operations/git-workflow.md「PRの作り方」）。
# - develop 宛て・main 宛ての PR: lint・型検査・単体テスト（結合を含む）・ビルド
# - main 宛ての PR（release/*・hotfix/*）: 上記に加えて、E2E（4 つのシャードで並行）・負荷テスト
# - ラベル ci:full を付けた PR: develop 宛てでも、E2E・負荷テストを実行する（確認したいときに使う）
# マージの必須条件にするチェックは、リポジトリの設定（ブランチ保護）で指定する（ジョブ名: lint・typecheck・unit-test・build、main 宛てはさらに e2e・stress）。
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# 秘密情報は使わない。リポジトリの読み取りのみ許可する。
permissions:
  contents: read

# 同じ PR で新しい実行が始まったら、古い実行を止める（E2E は長いため）。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: ESLint・oxlint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-test:
    name: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # DynamoDB アダプタの契約テストが使う、DynamoDB Local（AWS の公式のイメージ 3.3.1）を、コンテナで起動する。
      # - タグではなく、ダイジェスト（内容のハッシュ）で固定する（タグは、あとから別のイメージに付け替えられるため）。
      #   更新するときは、新しいタグのダイジェストに差し替える（`public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local` で確認）。
      # - 取得先は、3 つ。ECR Public の匿名の取得には、GitHub のランナーの共有の IP からの取得量の上限があり、
      #   `toomanyrequests: Data limit exceeded` で失敗することがある（Issue #95 の PR で発生）。同じダイジェストのため、
      #   どこから取得しても、同じ内容。上から順に、各 3 回まで試す。
      - name: DynamoDB Local を起動する
        run: |
          digest=sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab # 3.3.1
          for repository in public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local mirror.gcr.io/amazon/dynamodb-local docker.io/amazon/dynamodb-local; do
            for attempt in 1 2 3; do
              if docker pull "${repository}@${digest}"; then
                docker run --detach --name dynamodb-local --publish 8000:8000 "${repository}@${digest}"
                exit 0
              fi
              sleep $((attempt * 10))
            done
          done
          echo "::error::DynamoDB Local のイメージを、どの取得先からも取得できませんでした"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # 単体・結合のテスト。カバレッジの閾値（行・分岐・関数・文が 95% 以上）を下回ると失敗する。
      # DYNAMODB_ENDPOINT: 上の DynamoDB Local。契約テストを、DynamoDB のアダプタにも適用する（接続できるまで待つ）。
      - run: pnpm test:unit
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # main 宛ての PR、またはラベル ci:full の PR で実行する。速いチェックが成功してから始める（長いため）。
  #
  # E2E は、4 つに分けて（シャード）、別のランナーで並行して実行する。各シャードは、自分のサーバー（Vite・バックエンド）を起動する
  # ため、状態は共有しない。ブラウザとシステムのライブラリは、Playwright の公式のコンテナ（ダイジェストで固定）に入っているため、
  # `apt` を使わない（Ubuntu のミラーが遅いと、導入だけで 20 分以上かかったため。Issue #185）。
  # Playwright の版（package.json・pnpm-lock.yaml）を上げるときは、下のコンテナの版とダイジェストも、合わせて更新する
  # （合っていないと、下の「Playwright の版を確かめる」のステップが、失敗して知らせる）。
  e2e-shard:
    name: e2e-shard (${{ matrix.shard }}/4)
    if: github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    needs: [lint, typecheck, unit-test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host --init
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.0
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Playwright の版を確かめる
        run: |
          actual="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ "$actual" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::Playwright の版（$actual）が、コンテナの版（$PLAYWRIGHT_IMAGE_VERSION）と違います。ci.yml のコンテナの版とダイジェストを、更新してください"
            exit 1
          fi
      - uses: ./.github/actions/install-japanese-fonts
      # ポート 5173・8787 を使う（dev-ports.ts）。シャードは、別のランナーで動くため、衝突しない。
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      # 失敗の調査用。失敗したテストのスクリーンショット・トレース・エラーの文脈だけを保存する
      # （CI では、動画を撮らない。playwright.config.ts）。
      - name: 失敗時の成果物を保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: |
            test-result/e2e/**/test-failed-*.png
            test-result/e2e/**/error-context.md
            test-result/e2e/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  # 全シャードの結果をまとめる。ブランチ保護（Rulesets）の必須のチェック名 `e2e` を、変えないために置く。
  # シャードのどれかが失敗したら、失敗にする（速いチェックの失敗で、シャードが実行されなかったときは、そちらの失敗で、マージできない）。
  e2e:
    name: e2e
    if: ${{ !cancelled() && (github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
    needs: [e2e-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 全シャードの結果を確かめる
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard の結果: $RESULT"
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "::error::E2E のシャードが失敗しました（結果: $RESULT）"
            exit 1
          fi

  stress:
    name: stress
    if: github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    needs: [lint, typecheck, unit-test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # E2E と同じ、Playwright の公式のコンテナ（e2e-shard の説明を参照）
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # E2E と同じフォントにする（モバイル幅の表示の確認があるため）。
      - uses: ./.github/actions/install-japanese-fonts
      # 許容時間（tests/stress/support/limits.ts）を超える操作があると失敗する。
      # GitHub のランナーは、CPU の速さが実行のたびに違い、同時 10 人の保存（UC-06）が、許容 3 秒を超えたり
      # 超えなかったりした（約 2〜3.5 秒）。そのため、CI だけ、許容時間を 1.5 倍にする（NFR の値は、変えない。手元は 1 倍）。
      # 倍率は、結果ログに記録される。
      - run: pnpm test:stress
        env:
          STRESS_LIMIT_FACTOR: '1.5'
      # 結果ログは、成功・失敗にかかわらず保存する（応答時間の記録）。
      - name: 結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stress-result
          path: |
            test-result/stresstest.result.log
            test-result/stress/report
          retention-days: 14
          if-no-files-found: ignore
