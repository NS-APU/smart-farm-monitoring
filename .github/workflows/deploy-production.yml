# 本番サイト（実証実験用）のデプロイ（Issue #117。ADR-0013。docs/40_operations/operations.md 9 章）。開発サイトは、deploy-development.yml
# - **main ブランチだけ**からデプロイできる。GitHub の Environment「production」の設定（Deployment branches: main のみ）と、
#   このワークフローの条件（github.ref）の、二重で守る
# - **承認者の承認を必須**にする（Environment「production」の Required reviewers）。承認されるまで、ジョブは、始まらない
# - トリガ: main への push（自動。Issue #89。承認されるまで、ジョブは始まらない）と、手動実行（workflow_dispatch）。
#   main には、PR の CI（E2E・負荷テストを含む必須チェック）が成功した内容だけが入るため、CI の完了は待たず、push で動かす。
#   承認者は、承認の前に、CI の成功を確認する。承認待ちは、30 日で期限切れになる（手動実行で、やり直せる）
# - AWS へは、OIDC の一時的な認証で入る（長期のアクセスキーを使わない）。ロールの ARN は、Environment「production」の
#   シークレット AWS_DEPLOY_ROLE_ARN に設定する（本番用のロール sfm-github-actions-deploy-production。infra/lib/github-oidc-stack.ts）。
#   このロールを引き受けられるのは、Environment「production」のジョブだけ（開発サイトのジョブは、引き受けられない）
# - 独自のサブドメインを使うときは、Environment「production」の変数 SFM_DOMAIN_NAME・SFM_HOSTED_ZONE_NAME を設定する
#   （2 つとも。開発サイトとは別のサブドメイン。未設定なら cloudfront.net）
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # OIDC の ID トークンの発行（AWS のロールを引き受けるため）
  id-token: write

# 同時に 2 つのデプロイを動かさない。実行中のデプロイは、止めない（CloudFormation の更新が途中で止まるため）。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # main 以外からは、動かさない（Environment の Deployment branches の設定と、二重で守る）
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: 画面のビルド（dist/frontend）
        run: pnpm build
      - name: AWS の認証（OIDC）
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      # 認証に失敗したときだけ、GitHub が発行する OIDC トークンのクレームを表示する（診断用。Issue #87）。
      # AWS のロールの信頼ポリシー（infra/lib/github-oidc-stack.ts）の条件（aud・sub）と、見比べる。トークン自体は表示しない。
      - name: OIDC トークンのクレームの表示（認証の失敗時のみ）
        if: failure() && steps.aws-auth.outcome == 'failure'
        run: |
          response=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          RESPONSE="${response}" node -e "
          const token = JSON.parse(process.env.RESPONSE).value;
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
          for (const key of ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'environment', 'ref', 'job_workflow_ref']) {
            console.log(key + ': ' + String(claims[key]));
          }
          "
      - name: デプロイ（CDK）
        env:
          # 本番サイトのスタック（SfmProductionData・SfmProductionEvaluation）を作る。開発サイトのスタックには、触れない
          SFM_ENVIRONMENT: production
          SFM_DOMAIN_NAME: ${{ vars.SFM_DOMAIN_NAME }}
          SFM_HOSTED_ZONE_NAME: ${{ vars.SFM_HOSTED_ZONE_NAME }}
        run: pnpm --filter @smart-farm/infra run deploy
