# 開発サイト（現在の評価環境）のデプロイ（Issue #71・#117。docs/00_project/commands.md「評価環境（IaC）」）。本番サイトは、deploy-production.yml
# - 手動実行（workflow_dispatch）のみ。自動のトリガ（develop の更新）は、Issue #89 で追加する（ADR-0013）
# - AWS へは、OIDC の一時的な認証で入る（長期のアクセスキーを使わない）。ロールの ARN は、GitHub の Environment「development」の
#   シークレット AWS_DEPLOY_ROLE_ARN に設定する（ロールは infra/lib/github-oidc-stack.ts で作る。手順は commands.md）
# - Environment「development」で、デプロイできるブランチ（develop）を制限できる（ロールの信頼ポリシーも、この Environment を条件にしている。
#   本番サイトの Environment「production」のジョブは、このロールを引き受けられない）
# - 独自のサブドメインを使うときは、Environment の変数 SFM_DOMAIN_NAME・SFM_HOSTED_ZONE_NAME を設定する（2 つとも。未設定なら cloudfront.net）
name: Deploy development

on:
  workflow_dispatch:

permissions:
  contents: read
  # OIDC の ID トークンの発行（AWS のロールを引き受けるため）
  id-token: write

# 同時に 2 つのデプロイを動かさない。実行中のデプロイは、止めない（CloudFormation の更新が途中で止まるため）。
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: 画面のビルド（dist/frontend）
        run: pnpm build
      - name: AWS の認証（OIDC）
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      # 認証に失敗したときだけ、GitHub が発行する OIDC トークンのクレームを表示する（診断用。Issue #87）。
      # AWS のロールの信頼ポリシー（infra/lib/github-oidc-stack.ts）の条件（aud・sub）と、見比べる。トークン自体は表示しない。
      - name: OIDC トークンのクレームの表示（認証の失敗時のみ）
        if: failure() && steps.aws-auth.outcome == 'failure'
        run: |
          response=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          RESPONSE="${response}" node -e "
          const token = JSON.parse(process.env.RESPONSE).value;
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
          for (const key of ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'environment', 'ref', 'job_workflow_ref']) {
            console.log(key + ': ' + String(claims[key]));
          }
          "
      - name: デプロイ（CDK）
        env:
          # 開発サイトのスタック（SfmData・SfmEvaluation）を作る（Issue #117）
          SFM_ENVIRONMENT: development
          SFM_DOMAIN_NAME: ${{ vars.SFM_DOMAIN_NAME }}
          SFM_HOSTED_ZONE_NAME: ${{ vars.SFM_HOSTED_ZONE_NAME }}
        run: pnpm --filter @smart-farm/infra run deploy
