name: 機能要望・改善提案
description: 新機能の追加や、既存機能の改善を提案する
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        「何を作るか」より先に「誰がどんなことに困っているか」を書いてください。

        > **注意**: 秘密情報・個人情報・実データは含めないでください。
  - type: textarea
    id: problem
    attributes:
      label: 背景・解決したい課題
      description: 誰が、どんな場面で、何に困っているか。現状の対処方法があれば併せて書いてください。
      placeholder: 例）農作業者が、収穫ロボットの停止にすぐ気づけず、対応が遅れる。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 実現したいこと。画面案や操作の流れがあれば書いてください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 「何ができれば完了か」を、確認できる形で箇条書きにしてください。
      placeholder: |
        - [ ] 〇〇のとき、△△が表示される
        - [ ] □□の場合は、通知されない
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他の方法や、やらない場合の影響があれば書いてください。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 関係する領域
      multiple: true
      options:
        - 画面（フロントエンド）
        - API・バックエンド
        - データの取り込み
        - 健全性の評価（観点・判断基準）
        - 通知（Web Push）
        - 人の判断への関与（HITL）
        - 認証・ユーザー管理
        - 運用（バックアップ・手順）
        - その他・不明
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 優先度の希望
      options:
        - 高（運用に支障がある）
        - 中（あると助かる）
        - 低（余裕があれば）
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: 関連するユースケース・要件
      description: 分かる範囲で。例 UC-06、FR-xx
    validations:
      required: false
  - type: checkboxes
    id: docs
    attributes:
      label: 影響しそうなドキュメント
      description: 実装時に更新が必要になりそうなものを選んでください（分からなければ空欄で構いません）。
      options:
        - label: 要件（機能要件・ユースケース）
        - label: 機能仕様書（画面・API・処理の振る舞い）
        - label: データモデル・データ項目定義
        - label: 評価観点・判断基準
        - label: ADR（技術選定・設計方針の判断が必要）
